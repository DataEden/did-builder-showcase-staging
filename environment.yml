name: fin-tech
channels:
  - conda-forge
  - defaults

dependencies:
  # ------------------------------------------------------------
  # Python
  # ------------------------------------------------------------
  - python=3.12
  - pip

  # ------------------------------------------------------------
  # Core data stack
  # ------------------------------------------------------------
  - pandas
  - numpy
  - pyarrow
  - pyyaml
  - openpyxl
  - xlrd
  - tabulate

  # ------------------------------------------------------------
  # Database / SQL
  # ------------------------------------------------------------
  - sqlalchemy
  - psycopg2

  # ------------------------------------------------------------
  # Dashboard / visualization
  # ------------------------------------------------------------
  - streamlit
  - plotly
  - matplotlib
  - seaborn
  - altair

  # ------------------------------------------------------------
  # HTTP / utilities
  # ------------------------------------------------------------
  - requests
  - urllib3
  - httpx
  - python-dotenv

  # ------------------------------------------------------------
  # Notebook / development workflow
  # ------------------------------------------------------------
  - jupyter
  - jupyterlab
  - ipykernel
  - notebook
  - ipywidgets

  # ------------------------------------------------------------
  # Testing
  # ------------------------------------------------------------
  - pytest

  # ------------------------------------------------------------
  # Analytics / ML
  # ------------------------------------------------------------
  - scikit-learn
  - imbalanced-learn
  - scipy
  - statsmodels
  - xgboost

  # ------------------------------------------------------------
  # Pip packages
  # ------------------------------------------------------------
  - pip:
      - openai==2.30.0
      - yfinance==1.2.0
      - quantstats==0.0.81
      - fredapi==0.5.2
      - empyrical-reloaded==0.5.12
      - dash==4.1.0
      - jupytext==1.19.1
      - nbdev==3.0.12
